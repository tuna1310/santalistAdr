stages:
  - build
  - test

variables:
  DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

build_simulator:
  stage: build
  tags:
    - saas-macos-medium-m2
  script:
    - xcodebuild clean build -project SantaList.xcodeproj -scheme SantaList -destination 'platform=iOS Simulator,name=iPhone 15' -configuration Debug CODE_SIGNING_ALLOWED=NO
  artifacts:
    paths:
      - build/

test_unit:
  stage: test
  tags:
    - saas-macos-medium-m2
  script:
    - xcodebuild test -project SantaList.xcodeproj -scheme SantaList -destination 'platform=iOS Simulator,name=iPhone 15' CODE_SIGNING_ALLOWED=NO
