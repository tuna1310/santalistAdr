name: SantaList
options:
  bundleIdPrefix: com.santalist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SantaList:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SantaList
    settings:
      base:
        PRODUCT_NAME: SantaList
        PRODUCT_BUNDLE_IDENTIFIER: com.santalist.app
        INFOPLIST_FILE: SantaList/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  SantaListTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SantaListTests
    dependencies:
      - target: SantaList
    settings:
      base:
        PRODUCT_NAME: SantaListTests
        PRODUCT_BUNDLE_IDENTIFIER: com.santalist.appTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SantaList.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SantaList"
        BUNDLE_LOADER: "$(TEST_HOST)"
